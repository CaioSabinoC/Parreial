
name: CI/CD - Parreiral

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

  deploy:
    name: Deploy na Azure
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Preparar acesso SSH
        env:
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          AZURE_KNOWN_HOSTS: ${{ secrets.AZURE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$AZURE_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$AZURE_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Atualizar aplicação na Azure
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$AZURE_USER@$AZURE_HOST" \
            'set -e
             cd /home/azureuser/Parreial
             git pull --ff-only origin main
             npm ci --omit=dev
             pm2 restart parreiral --update-env
             pm2 save
             pm2 status'
